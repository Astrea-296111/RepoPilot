name: Windows evaluation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "Run the Qwen3.8-Max API evaluation (uses paid tokens)"
        type: boolean
        required: true
        default: false
      region:
        description: "DashScope API key region"
        type: choice
        required: true
        default: beijing
        options:
          - beijing
          - singapore

permissions:
  contents: read

jobs:
  checks:
    name: Tests and scripted evaluation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Project tests
        run: python -m pytest -q
      - name: Scripted Demo on a temporary copy
        run: python eval/run_eval.py

  qwen:
    name: Qwen3.8-Max on a temporary Demo copy
    if: ${{ inputs.run_real_model }}
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      LLM_MODEL: qwen3.8-max
      LLM_BASE_URL: ${{ inputs.region == 'singapore' && 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1' || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run real model evaluation
        env:
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python eval/run_actions.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-diagnostics
          path: eval/results/actions-qwen.json
          if-no-files-found: warn
          retention-days: 7
