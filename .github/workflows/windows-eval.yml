name: Windows evaluation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "Run the Qwen3.8-Max mini benchmark (uses paid tokens)"
        type: boolean
        required: true
        default: false
      runs:
        description: "Runs per benchmark task"
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "3"
      region:
        description: "DashScope API key region"
        type: choice
        required: true
        default: beijing
        options:
          - beijing
          - singapore

permissions:
  contents: read

jobs:
  checks:
    name: Tests and scripted benchmark
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Project tests
        run: python -m pytest -q
      - name: Scripted five-task benchmark
        run: python eval/run_benchmark.py --fake --runs 1
      - name: Upload scripted benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-fake
          path: eval/results/benchmark-fake.json
          if-no-files-found: warn
          retention-days: 7

  qwen:
    name: Qwen3.8-Max five-task benchmark
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_real_model) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qwen-eval]')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LLM_MODEL: qwen3.8-max
      LLM_BASE_URL: ${{ inputs.region == 'singapore' && 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1' || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      BENCH_RUNS: ${{ inputs.runs || '1' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run real-model mini benchmark
        env:
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python eval/run_benchmark.py --runs $env:BENCH_RUNS --limit 5
      - name: Upload Qwen benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-qwen
          path: eval/results/benchmark-qwen.json
          if-no-files-found: warn
          retention-days: 14
