name: Windows evaluation

on:
  push:
    branches:
      - main
      - 'work/**'
  pull_request:
  workflow_dispatch:
    inputs:
      run_real_model:
        description: "Run Qwen3.8-Max benchmarks (uses paid tokens)"
        type: boolean
        required: true
        default: false
      run_agent:
        description: "Include Agent; uncheck for a one-shot-only ablation"
        type: boolean
        required: true
        default: true
      run_oneshot:
        description: "Include one-shot; uncheck for an Agent-only ablation"
        type: boolean
        required: true
        default: true
      oneshot_context:
        description: "One-shot input files: Top-K, import graph, or all public Python files"
        type: choice
        required: true
        default: retrieved
        options:
          - retrieved
          - graph
          - full
      runs:
        description: "Runs per benchmark task"
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "3"
      task_ids:
        description: "Optional comma-separated task IDs; leave blank for all 25"
        type: string
        required: false
        default: ""
      region:
        description: "DashScope API key region"
        type: choice
        required: true
        default: beijing
        options:
          - beijing
          - singapore

permissions:
  contents: read

concurrency:
  group: repopilot-eval-${{ github.repository }}
  cancel-in-progress: false

jobs:
  checks:
    name: Tests and scripted 25-task benchmark
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Project tests
        run: python -m pytest -q
      - name: Key-free CLI demo in a fresh temporary repository
        run: python eval/demo.py --runtime custom
      - name: Scripted Agent benchmark
        run: python eval/run_benchmark.py --fake --runs 1 --require-all
      - name: Scripted one-shot benchmark
        run: python eval/run_one_shot.py --fake --runs 1 --require-all
      - name: File retrieval diagnostic
        run: python eval/measure_retrieval.py --json-out eval/results/retrieval-diagnostics.json
      - name: Upload scripted diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-scripted
          path: |
            eval/results/agent-fake.json
            eval/results/oneshot-fake.json
            eval/results/retrieval-diagnostics.json
          if-no-files-found: warn
          retention-days: 7

  integrations:
    name: Linux Python ${{ matrix.python }} (${{ matrix.extras }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            extras: dev
          - python: '3.12'
            extras: dev,full
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install selected optional dependency combination
        env:
          EXTRAS: ${{ matrix.extras }}
        run: python -m pip install -e ".[${EXTRAS}]"
      - run: python -m pip check
      - name: Unit, graph, MCP stdio and OTel integration tests
        run: python -m pytest -q --junitxml=eval/results/pytest.xml
      - run: python eval/run_benchmark.py --fake --runs 1 --require-all
      - run: python eval/run_one_shot.py --fake --runs 1 --require-all
      - name: Same 25 scripted tasks with LangGraph orchestration
        if: matrix.extras == 'dev,full'
        run: python eval/run_benchmark.py --fake --runtime langgraph --runs 1 --require-all
      - name: Platform composition with MCP, hybrid retrieval, reflection and memory
        if: matrix.extras == 'dev,full'
        run: python eval/run_benchmark.py --fake --runtime langgraph --tool-backend mcp --retrieval hybrid --reflection --memory --require-all --output eval/results/platform.json
      - name: Documented custom CLI demo
        run: python eval/demo.py --runtime custom
      - name: Documented LangGraph console trace demo
        if: matrix.extras == 'dev,full'
        run: python eval/demo.py --runtime langgraph --trace
      - name: Packaging, import and CLI smoke
        run: |
          python -m pip wheel --no-deps . --wheel-dir dist
          python -c "import repopilot, repopilot.cli, repopilot.api.server"
          repopilot --help
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: deterministic-${{ matrix.python }}
          path: |
            eval/results/*.json
            eval/results/*.md
            eval/results/pytest.xml
            dist/*.whl
          retention-days: 30

  docker:
    name: Real Docker isolation and fixed external references
    needs: integrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPOPILOT_DOCKER_TESTS: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,full]'
      - run: docker build -t repopilot-sandbox:dev -f Dockerfile.sandbox .
      - name: Trusted custom and LangGraph demos, protected mounts, resources, network and timeout
        run: python -m pytest tests/test_docker_integration.py -q --junitxml=eval/results/docker.xml
      - name: Documented Docker CLI demos for both runtimes
        run: |
          python eval/demo.py --runtime custom --executor docker
          python eval/demo.py --runtime langgraph --executor docker
      - run: docker build -t repopilot-external:fixed -f eval/Dockerfile.external .
      - name: Validate the unchanged 10 historical bugs and 129 public plus hidden cases
        env:
          REPOPILOT_DOCKER_IMAGE: repopilot-external:fixed
        run: python eval/run_external.py --mode reference --output eval/results/external-reference.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: docker-integration
          path: |
            eval/results/docker.xml
            eval/results/external-reference.json
          retention-days: 30

  qwen-agent:
    name: Qwen3.8-Max Agent shard ${{ matrix.shard }}
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_real_model && inputs.run_agent) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qwen-eval]')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.task_ids != '' && '[0]' || '[0,1,2,3,4]') }}
    env:
      LLM_MODEL: qwen3.8-max
      LLM_BASE_URL: ${{ inputs.region == 'singapore' && 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1' || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      BENCH_RUNS: ${{ inputs.runs || '1' }}
      BENCH_SHARD: ${{ matrix.shard }}
      BENCH_SHARD_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.task_ids != '' && '1' || '5' }}
      BENCH_TASK_IDS: ${{ inputs.task_ids || '' }}
      LLM_TIMEOUT_SECONDS: "180"
      LLM_REASONING_EFFORT: medium
      LLM_STREAM: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run RepoPilot Agent benchmark shard
        env:
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          $taskArgs = @()
          if ($env:BENCH_TASK_IDS) {
            foreach ($id in $env:BENCH_TASK_IDS.Split(',')) {
              $id = $id.Trim()
              if (-not $id) { throw "task_ids contains an empty task ID" }
              $taskArgs += @('--task', $id)
            }
          }
          python eval/run_benchmark.py --runs $env:BENCH_RUNS --shard-index $env:BENCH_SHARD --shard-count $env:BENCH_SHARD_COUNT @taskArgs
      - name: Upload Agent diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-qwen-shard-${{ matrix.shard }}
          path: |
            eval/results/agent-qwen-shard${{ matrix.shard }}.json
            eval/results/agent-qwen.json
          if-no-files-found: warn
          retention-days: 14

  qwen-oneshot:
    name: Qwen3.8-Max one-shot shard ${{ matrix.shard }}
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_real_model && inputs.run_oneshot) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[qwen-eval]')) }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.task_ids != '' && '[0]' || '[0,1,2,3,4]') }}
    env:
      LLM_MODEL: qwen3.8-max
      LLM_BASE_URL: ${{ inputs.region == 'singapore' && 'https://dashscope-intl.aliyuncs.com/compatible-mode/v1' || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      BENCH_RUNS: ${{ inputs.runs || '1' }}
      BENCH_SHARD: ${{ matrix.shard }}
      BENCH_SHARD_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.task_ids != '' && '1' || '5' }}
      BENCH_TASK_IDS: ${{ inputs.task_ids || '' }}
      BENCH_CONTEXT_MODE: ${{ inputs.oneshot_context || 'retrieved' }}
      LLM_TIMEOUT_SECONDS: "180"
      LLM_REASONING_EFFORT: medium
      LLM_STREAM: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run one-shot baseline shard
        env:
          LLM_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          $taskArgs = @()
          if ($env:BENCH_TASK_IDS) {
            foreach ($id in $env:BENCH_TASK_IDS.Split(',')) {
              $id = $id.Trim()
              if (-not $id) { throw "task_ids contains an empty task ID" }
              $taskArgs += @('--task', $id)
            }
          }
          python eval/run_one_shot.py --runs $env:BENCH_RUNS --context-mode $env:BENCH_CONTEXT_MODE --shard-index $env:BENCH_SHARD --shard-count $env:BENCH_SHARD_COUNT @taskArgs
      - name: Upload one-shot diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: oneshot-qwen-shard-${{ matrix.shard }}
          path: |
            eval/results/oneshot-qwen-shard${{ matrix.shard }}.json
            eval/results/oneshot-qwen.json
          if-no-files-found: warn
          retention-days: 14
