name: Platform services
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repopilot-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repopilot
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: repopilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U repopilot -d repopilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REPOPILOT_TEST_DATABASE_URL: postgresql+psycopg://repopilot:test-only@localhost:5432/repopilot
      REPOPILOT_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,full]'
      - run: python -m pytest tests/test_service_integration.py tests/test_api_tasks.py -q --junitxml=eval/results/services.xml
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: platform-services-tests
          path: eval/results/services.xml
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:8000/health
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop ephemeral services
        if: always()
        run: docker compose down -v
