[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-agent"
version = "0.1.0"
description = "A small, explainable coding agent for real repositories"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "pydantic>=2,<3", "typer>=0.12,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "SQLAlchemy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
langgraph = ["langgraph>=1.2.12,<1.3"]
mcp = ["mcp>=2.2,<3"]
rag = ["rank-bm25>=0.2.2,<1", "faiss-cpu>=1.8,<2", "numpy>=1.26,<3"]
server = ["redis>=5,<8", "psycopg[binary]>=3.1,<4"]
observability = ["opentelemetry-sdk>=1.45,<2", "opentelemetry-exporter-otlp-proto-http>=1.45,<2"]
full = ["repopilot-agent[langgraph,mcp,observability,rag,server]"]

[project.scripts]
repopilot = "repopilot.cli:app"

[tool.setuptools.packages.find]
include = ["repopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
